<div class="tf-page">
  <h2 class="tf-title">Nuevo Traslado entre Bodegas</h2>

  <form [formGroup]="form" (ngSubmit)="submit()" class="tf-form">
    <div class="tf-grid">
      <app-warehouse-picker
        label="Bodega origen *"
        placeholder="Buscar bodega origen..."
        (selected)="onSourceWarehouse($event)"
      />

      <app-warehouse-picker
        label="Bodega destino *"
        placeholder="Buscar bodega destino..."
        (selected)="onTargetWarehouse($event)"
      />
    </div>

    <mat-form-field appearance="outline">
      <mat-label>Notas</mat-label>
      <textarea matInput formControlName="notes" rows="2" maxlength="500"></textarea>
    </mat-form-field>

    <div formArrayName="items">
      @for (item of items.controls; track i; let i = $index) {
        <div [formGroupName]="i" class="tf-item-group">
          <div class="tf-item-header">
            <span>Ítem #{{ i + 1 }}</span>
            @if (items.length > 1) {
              <button mat-icon-button color="warn" type="button" (click)="removeItem(i)">
                <mat-icon>remove_circle</mat-icon>
              </button>
            }
          </div>
          <div class="tf-grid">
            <app-product-search
              label="Producto *"
              placeholder="Buscar producto..."
              (selected)="onProductSelected(i, $event)"
            />

            <app-batch-picker label="Lote (opcional)" (selected)="onBatchSelected(i, $event)" />

            <mat-form-field appearance="outline">
              <mat-label>Cantidad *</mat-label>
              <input matInput type="number" formControlName="quantity" min="0.001" step="0.001" />
            </mat-form-field>
          </div>
        </div>
      }
    </div>

    <button mat-button type="button" (click)="addItem()">
      <mat-icon>add</mat-icon>
      Agregar ítem
    </button>

    @if (error()) {
      <p class="tf-error">{{ error() }}</p>
    }

    <div class="tf-actions">
      <button mat-flat-button color="primary" type="submit" [disabled]="saving() || form.invalid">
        @if (saving()) {
          <mat-spinner diameter="18" />
        } @else {
          <mat-icon>check</mat-icon>
        }
        Crear traslado
      </button>
    </div>
  </form>
</div>
