<div class="af-page">
  <h2 class="af-title">Nuevo Ajuste de Inventario</h2>

  <form [formGroup]="form" (ngSubmit)="submit()" class="af-form">
    <div class="af-grid">
      <app-product-search
        label="Producto *"
        placeholder="Buscar producto..."
        (selected)="onProductSelected($event)"
      />

      <app-warehouse-picker
        label="Bodega *"
        placeholder="Buscar bodega..."
        (selected)="onWarehouseSelected($event)"
      />
    </div>

    <div class="af-grid">
      <app-batch-picker label="Lote (opcional)" (selected)="onBatchSelected($event)" />

      <mat-form-field appearance="outline">
        <mat-label>Tipo de ajuste *</mat-label>
        <mat-select formControlName="adjustmentType">
          @for (opt of typeOptions; track opt.value) {
            <mat-option [value]="opt.value">{{ opt.label }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Cantidad después del ajuste *</mat-label>
        <input matInput type="number" formControlName="quantityAfter" min="0" step="0.001" />
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline">
      <mat-label>Motivo *</mat-label>
      <textarea matInput formControlName="reason" rows="3" maxlength="500"></textarea>
    </mat-form-field>

    @if (error()) {
      <p class="af-error">{{ error() }}</p>
    }

    <div class="af-actions">
      <button mat-flat-button color="primary" type="submit" [disabled]="saving() || form.invalid">
        @if (saving()) {
          <mat-spinner diameter="18" />
        } @else {
          <mat-icon>check</mat-icon>
        }
        Guardar ajuste
      </button>
    </div>
  </form>
</div>
