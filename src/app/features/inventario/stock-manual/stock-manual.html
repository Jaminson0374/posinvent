<div style="max-width: 700px; margin: 0 auto; padding: 1rem">
  <h2 style="font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem">
    Entradas y Salidas Manuales
  </h2>
  <mat-tab-group>
    <mat-tab label="Entrada">
      <form
        [formGroup]="entryForm"
        (ngSubmit)="entrySubmit()"
        style="display: flex; flex-direction: column; gap: 1rem; padding: 1rem 0"
      >
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1rem">
          <app-product-search
            label="Producto *"
            placeholder="Buscar producto..."
            (selected)="onEntryProductSelected($event)"
          />
          <app-batch-picker label="Lote (opcional)" (selected)="onEntryBatchSelected($event)" />
          <app-warehouse-picker
            label="Bodega *"
            placeholder="Buscar bodega..."
            (selected)="onEntryWarehouseSelected($event)"
          />
          <mat-form-field appearance="outline">
            <mat-label>Cantidad *</mat-label>
            <input matInput type="number" formControlName="quantity" min="0.001" step="0.001" />
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Costo unitario</mat-label>
            <input matInput type="number" formControlName="unitCost" min="0" step="0.01" />
          </mat-form-field>
        </div>
        <mat-form-field appearance="outline">
          <mat-label>Notas</mat-label>
          <input matInput formControlName="notes" />
        </mat-form-field>
        <div style="text-align: right">
          <button
            mat-flat-button
            color="primary"
            type="submit"
            [disabled]="saving() || entryForm.invalid"
          >
            <mat-icon>add</mat-icon> Registrar entrada
          </button>
        </div>
      </form>
    </mat-tab>
    <mat-tab label="Salida">
      <form
        [formGroup]="exitForm"
        (ngSubmit)="exitSubmit()"
        style="display: flex; flex-direction: column; gap: 1rem; padding: 1rem 0"
      >
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1rem">
          <app-product-search
            label="Producto *"
            placeholder="Buscar producto..."
            (selected)="onExitProductSelected($event)"
          />
          <app-batch-picker label="Lote (opcional)" (selected)="onExitBatchSelected($event)" />
          <app-warehouse-picker
            label="Bodega *"
            placeholder="Buscar bodega..."
            (selected)="onExitWarehouseSelected($event)"
          />
          <mat-form-field appearance="outline">
            <mat-label>Cantidad *</mat-label>
            <input matInput type="number" formControlName="quantity" min="0.001" step="0.001" />
          </mat-form-field>
        </div>
        <mat-form-field appearance="outline">
          <mat-label>Motivo *</mat-label>
          <input matInput formControlName="reason" />
        </mat-form-field>
        <div style="text-align: right">
          <button
            mat-flat-button
            color="warn"
            type="submit"
            [disabled]="saving() || exitForm.invalid"
          >
            <mat-icon>remove</mat-icon> Registrar salida
          </button>
        </div>
      </form>
    </mat-tab>
  </mat-tab-group>
</div>
