<div class="df-page">
  <h2 class="df-title">Nuevo Decomiso</h2>

  <form [formGroup]="form" (ngSubmit)="submit()" class="df-form">
    <div class="df-grid">
      <app-product-search
        label="Producto *"
        placeholder="Buscar producto..."
        (selected)="onProductSelected($event)"
      />

      <app-warehouse-picker
        label="Bodega *"
        placeholder="Buscar bodega..."
        (selected)="onWarehouseSelected($event)"
      />
    </div>

    <div class="df-grid">
      <app-batch-picker label="Lote (opcional)" (selected)="onBatchSelected($event)" />

      <mat-form-field appearance="outline">
        <mat-label>Tipo de decomiso *</mat-label>
        <mat-select formControlName="disposalType">
          @for (opt of typeOptions; track opt.value) {
            <mat-option [value]="opt.value">{{ opt.label }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Cantidad *</mat-label>
        <input matInput type="number" formControlName="quantity" min="0.001" step="0.001" />
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline">
      <mat-label>Motivo *</mat-label>
      <textarea matInput formControlName="reason" rows="3" maxlength="500"></textarea>
    </mat-form-field>

    @if (error()) {
      <p class="df-error">{{ error() }}</p>
    }

    <div class="df-actions">
      <button mat-flat-button color="primary" type="submit" [disabled]="saving() || form.invalid">
        @if (saving()) {
          <mat-spinner diameter="18" />
        } @else {
          <mat-icon>check</mat-icon>
        }
        Crear decomiso
      </button>
    </div>
  </form>
</div>
