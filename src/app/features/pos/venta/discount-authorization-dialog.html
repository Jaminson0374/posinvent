<h2 mat-dialog-title class="dad-title">
  <mat-icon>admin_panel_settings</mat-icon> Autorización de descuento
</h2>

<mat-dialog-content class="dad-content">
  <p class="dad-hint">Este descuento requiere la aprobación de un administrador.</p>

  <form [formGroup]="form" autocomplete="off">
    <mat-form-field appearance="outline" class="dad-field">
      <mat-label>Usuario administrador</mat-label>
      <input matInput formControlName="username" autocomplete="off" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="dad-field">
      <mat-label>Contraseña</mat-label>
      <input matInput type="password" formControlName="password" autocomplete="off" />
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancelar</button>
  <button mat-flat-button color="primary" (click)="submit()" [disabled]="form.invalid">
    Autorizar
  </button>
</mat-dialog-actions>
